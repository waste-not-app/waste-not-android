version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Host tests run Robolectric on API 35; the instrumented jar must match that SDK level.
      - dependency-name: "org.robolectric:android-all-instrumented"
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
    commit-message:
      prefix: fix(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # CI and the Gradle toolchain build on JDK 17; change the image and CI together.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
