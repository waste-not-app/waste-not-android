name: Android Release & Deploy

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Custom Version (e.g., 1.0.1). Leave blank to use tag or build.gradle.kts'
        required: false
        default: ''
      deploy_to_vm:
        description: 'Deploy APK to staging VM (waste-not.bccdev.id)?'
        type: boolean
        required: true
        default: true
  push:
    tags:
      - 'v*'
permissions:
  contents: read

jobs:
  release-and-deploy:
    name: Build, Sign, and Deploy APK
    runs-on: [self-hosted, alberd-staging-android]
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Decode Release Keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wastenot-release.jks"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$RUNNER_TEMP/wastenot-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "Warning: ANDROID_KEYSTORE_BASE64 secret not set. Building without custom release keystore."
          fi

      - name: Verify Release
        run: ./gradlew lintRelease testDebugUnitTest --no-daemon --max-workers=2

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WASTENOT_RELEASE_API_BASE_URL: ${{ vars.WASTENOT_RELEASE_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$WASTENOT_RELEASE_API_BASE_URL" ]; then
            echo "Error: WASTENOT_RELEASE_API_BASE_URL must point to the HTTPS backend before publishing." >&2
            exit 1
          fi
          ./gradlew assembleRelease --no-daemon -Pwastenot.hotReload=false \
            "-Pwastenot.releaseApiBaseUrl=$WASTENOT_RELEASE_API_BASE_URL"

      - name: Verify live data adapters
        run: python3 scripts/verify_live_data.py app/build/outputs/apk/release/*.apk

      - name: Prepare APK Files
        id: prepare_apk
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          set -euo pipefail

          # Find release APK
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found in app/build/outputs/apk/release" >&2
            exit 1
          fi

          # Determine version name
          if [ -n "$VERSION_OVERRIDE" ]; then
            VERSION="$VERSION_OVERRIDE"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE_VER="$(grep -m 1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
            VERSION="${BASE_VER}-b${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$ ]]; then
            echo "Error: Version must be a filename-safe semantic version." >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/apk-release"
          VERSIONED_APK="wastenot-v${VERSION}.apk"
          cp "$APK_PATH" "$RUNNER_TEMP/apk-release/$VERSIONED_APK"
          cp "$APK_PATH" "$RUNNER_TEMP/apk-release/latest.apk"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versioned_apk=$VERSIONED_APK" >> "$GITHUB_OUTPUT"
          echo "Built APK: $VERSIONED_APK (Source: $APK_PATH)"

      - name: Deploy APK to Staging VM
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_to_vm == 'true' }}
        env:
          BACKEND_DIR: ${{ secrets.BACKEND_DIR || '/var/www/wastenot-apk' }}
          HAS_RELEASE_KEYSTORE: ${{ steps.keystore.outputs.has_keystore }}
          VERSIONED_APK: ${{ steps.prepare_apk.outputs.versioned_apk }}
        run: |
          set -euo pipefail

          if [ "$HAS_RELEASE_KEYSTORE" != "true" ]; then
            echo "Error: Deployment requires a signed release APK." >&2
            exit 1
          fi

          mkdir -p "$BACKEND_DIR/apk"
          cp "$RUNNER_TEMP/apk-release/$VERSIONED_APK" "$BACKEND_DIR/apk/"
          cp scripts/manage_releases.py "$BACKEND_DIR/manage_releases.py"
          python3 "$BACKEND_DIR/manage_releases.py" "$BACKEND_DIR"

          echo "Deployment successful! Check https://waste-not.bccdev.id/apk/"
