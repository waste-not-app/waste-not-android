name: Android CI

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'codex/**'
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run Android Lint and Unit Tests
        run: ./gradlew lintDebug lintStaging lintRelease testDebugUnitTest --no-daemon --max-workers=2

      - name: Verify native minimum SDK and font distribution
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest -Pwastenot.hotReload=false --no-daemon --max-workers=2
          python3 scripts/verify_minimum_sdk.py app/build/outputs/apk/debug/app-debug.apk
          mkdir -p app/build/outputs/apk/native-verification
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/native-verification/app-native-api30.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk app/build/outputs/apk/native-verification/app-native-api30-androidTest.apk

      - name: Build Debug, Staging, Release and Instrumentation APKs
        run: ./gradlew assembleDebug assembleStaging assembleRelease assembleDebugAndroidTest --no-daemon --max-workers=2

      - name: Verify environment configuration and packaged policies
        run: python3 scripts/verify_build_environments.py

      - name: Verify release packaging inputs
        run: python3 scripts/verify_release_workflow.py

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wastenot-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/staging/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/outputs/apk/native-verification/*.apk
          if-no-files-found: error

      - name: Upload Verification Reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-reports-${{ github.sha }}
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/tests/
          if-no-files-found: ignore
