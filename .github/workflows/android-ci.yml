name: Android CI

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'codex/**'
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run Android Lint and Unit Tests
        run: ./gradlew lintDebug lintStaging lintRelease testDebugUnitTest --no-daemon --max-workers=2

      - name: Build Debug, Staging and Release APKs
        run: ./gradlew assembleDebug assembleStaging assembleRelease --no-daemon --max-workers=2

      - name: Verify environment configuration and packaged policies
        run: python3 scripts/verify_build_environments.py

      - name: Verify release packaging inputs
        run: python3 scripts/verify_release_workflow.py

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wastenot-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/staging/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Verification Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.sha }}
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/tests/
          if-no-files-found: ignore
