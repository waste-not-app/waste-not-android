[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wastenot-ai"
version = "0.1.0"
description = "Local WasteNot YOLO and Gemini prototype; private inference worker"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.11.7",
  "httpx==0.28.1",
  "Pillow==11.2.1",
  "python-dotenv==1.1.0",
]

[project.optional-dependencies]
yolo = ["ultralytics==8.4.183"]
worker = ["fastapi==0.115.14", "uvicorn==0.35.0", "python-multipart==0.0.32"]
test = ["pytest==8.4.1", "jsonschema==4.26.0", "openapi-spec-validator==0.9.0"]

[project.scripts]
wastenot-ai = "wastenot_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wastenot_ai = ["data/*.json", "web/*.html", "web/*.css", "web/*.js", "web/*.ttf", "web/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
